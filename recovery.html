<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bet backups</title>
<style>body{background:#0b162a;color:#f7f9fb;font:16px system-ui;max-width:700px;margin:auto;padding:24px}a{color:#b8d4e8}button,select,input{font:inherit;padding:10px;margin:8px 0}button{background:#e64100;color:white;border:0;border-radius:8px}section{background:#15243b;padding:16px;border-radius:10px;margin:16px 0}li{margin:8px 0}#status{white-space:pre-wrap}[hidden]{display:none!important}</style>
<a href="/">Back to app</a><h1>Bet backups</h1><p>Review a saved copy before restoring a week. Restoring replaces that week’s current bets; a new backup protects the version you replace.</p>
<label>Week <select id="week"></select></label><button id="load">Find backups</button><div id="status" role="status"></div><ul id="list"></ul><button id="more" hidden>More backups</button>
<section id="preview" hidden><h2>Review saved copy</h2><p id="detail"></p><ul id="bets"></ul><label><input id="confirm" type="checkbox">I want to replace this week with the saved copy shown above.</label><br><button id="restore" disabled>Restore this copy</button></section>
<script>
var current=null,cursor=null,loadGeneration=0;
var el=id=>document.getElementById(id);
async function api(url,options){var r=await fetch(url,Object.assign({credentials:'same-origin',cache:'no-store'},options)),j=await r.json();if(!r.ok)throw Error(r.status===401?'Unlock bets in the app, then return here.':j.error||'Request failed');return j}
function message(s){el('status').textContent=s}
function clearPreview(){current=null;el('preview').hidden=true;el('confirm').checked=false;el('restore').disabled=true}
async function listing(more){var generation=++loadGeneration;clearPreview();if(!more){el('list').textContent='';cursor=null}message('Loading backups…');try{var j=await api('/api/bet-backups?week='+el('week').value+(cursor?'&cursor='+encodeURIComponent(cursor):''));if(generation!==loadGeneration)return;cursor=j.nextCursor;el('more').hidden=!cursor;j.backups.sort((a,b)=>b.backupId.localeCompare(a.backupId)).forEach(function(x){var li=document.createElement('li'),button=document.createElement('button');button.textContent=new Date(x.backupId.split('_')[0]).toLocaleString();button.onclick=()=>preview(x.backupId);li.appendChild(button);el('list').appendChild(li)});message(el('list').children.length?'Choose a saved copy to review.':'No backups yet. New imports will create them.')}catch(e){message(e.message)}}
async function preview(id){var generation=++loadGeneration;clearPreview();try{var j=await api('/api/bet-backups?week='+el('week').value+'&backup='+encodeURIComponent(id));if(generation!==loadGeneration)return;current=j;el('detail').textContent='Saved '+new Date(j.createdAt).toLocaleString()+'. '+j.snapshot.bets.length+' bets in this copy; '+j.currentCount+' bets currently saved.';el('bets').textContent='';j.snapshot.bets.forEach(function(b){var li=document.createElement('li');li.textContent=(b.description||b.selection||b.betId)+' — '+b.betId;el('bets').appendChild(li)});el('preview').hidden=false;message('Review the complete list before restoring.')}catch(e){message(e.message)}}
el('week').onchange=()=>{loadGeneration++;clearPreview();el('list').textContent='';el('more').hidden=true;cursor=null};el('load').onclick=()=>listing(false);el('more').onclick=()=>listing(true);el('confirm').onchange=()=>el('restore').disabled=!el('confirm').checked;
el('restore').onclick=async()=>{if(!current||!el('confirm').checked)return;el('restore').disabled=true;message('Restoring…');try{var j=await api('/api/bet-backups',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({week:current.week,backupId:current.backupId,expectedRevision:current.currentRevision,confirmRestore:true})});clearPreview();message('Restored '+j.count+' bets. Return to the app and refresh.')}catch(e){clearPreview();message(e.message+' Select the backup again before retrying.')}};
(async()=>{try{var j=await api('/api/archive');j.weeks.slice().reverse().forEach(function(w){var o=document.createElement('option');o.value=w;o.textContent=w;el('week').appendChild(o)});await listing(false)}catch(e){message(e.message)}})();
</script></html>
