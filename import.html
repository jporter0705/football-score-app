<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0B162A"><title>Add Bets</title><style>
:root{--bg:#0B162A;--panel:#15243B;--border:#30415B;--text:#f7f9fb;--muted:#8fb0c9;--accent:#E64100;--good:#63e6a1;--bad:#ef5350}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:680px;margin:auto;padding:16px;min-height:100vh}h1{font-size:22px;margin:8px 0 4px}.sub{color:var(--muted);font-size:12px;margin-bottom:14px}.card,.box{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px;margin:10px 0}.card b{display:block;margin-bottom:5px}.meta{font-size:12px;color:var(--muted);line-height:1.6}.legs{border-top:1px solid var(--border);margin-top:8px;padding-top:7px;font-size:12px}.leg{padding:4px 0}.totals{font-weight:800;margin:14px 0}button,input{font:inherit;border-radius:9px;padding:10px;border:1px solid var(--border)}button{background:var(--accent);color:white;font-weight:800;width:100%;cursor:pointer}button:disabled{opacity:.5}input{background:#0d1720;color:white;width:100%;margin:7px 0}.secondary{background:var(--panel)}#status{margin:12px 0;font-size:13px;line-height:1.5}.good{color:var(--good)}.bad{color:#ff8c8c}a{color:#b8d4e8}.hidden{display:none}
</style></head><body><div class="app"><h1>Add bets</h1><div class="sub">Review bets sent from ChatGPT before saving them to your private football app.</div><div id="content"></div><div id="login" class="box hidden"><b>Unlock private bets</b><div class="meta">Your access key stays on this page and is sent only to your app's /api/session endpoint.</div><input id="key" type="password" autocomplete="current-password" placeholder="Access key"><button id="unlock">Unlock</button></div><button id="add" class="hidden">Add bets</button><div id="status" role="status"></div><a href="/">Back to football app</a></div><script>
var payload=null;
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function money(n){return '$'+Number(n||0).toFixed(2).replace('.00','')}
function decode(){try{var h=location.hash.slice(1),p=new URLSearchParams(h).get('bets');if(!p)throw Error('No bet payload in this link.');p=p.replace(/-/g,'+').replace(/_/g,'/');while(p.length%4)p+='=';return JSON.parse(decodeURIComponent(escape(atob(p))))}catch(e){document.getElementById('status').innerHTML='<span class="bad">'+esc(e.message||'Invalid bet link')+'</span>';return null}}
function render(){if(!payload)return;var risk=0,win=0,html='';payload.bets.forEach(function(b){risk+=Number(b.risk||b.amount||0);win+=Number(b.toWin||b.possibleWin||0);html+='<div class="card"><b>'+esc(b.description||b.selection||b.market||'Bet')+'</b><div class="meta">Bet ID '+esc(b.betId)+' · Risk '+money(b.risk||b.amount)+' · To win '+money(b.toWin||b.possibleWin)+'</div>';if(b.legs&&b.legs.length)html+='<div class="legs">'+b.legs.map(function(l){return '<div class="leg">• '+esc(l.description||l.selection||l.player||'Leg')+'</div>'}).join('')+'</div>';html+='</div>'});html+='<div class="totals">'+payload.bets.length+' bet'+(payload.bets.length===1?'':'s')+' · '+money(risk)+' risk · '+money(win)+' possible profit</div>';document.getElementById('content').innerHTML=html}
async function session(){try{var r=await fetch('/api/session',{credentials:'same-origin'}),j=await r.json();return !!j.authenticated}catch(e){return false}}
async function auth(){var key=document.getElementById('key').value;if(!key)return;var s=document.getElementById('status');s.textContent='Unlocking…';try{var r=await fetch('/api/session',{method:'POST',headers:{'content-type':'application/json'},credentials:'same-origin',body:JSON.stringify({key:key})}),j=await r.json();if(!r.ok)throw Error(j.error||'Unlock failed');document.getElementById('key').value='';document.getElementById('login').classList.add('hidden');document.getElementById('add').classList.remove('hidden');s.innerHTML='<span class="good">Unlocked. Review above, then tap Add bets.</span>'}catch(e){s.innerHTML='<span class="bad">'+esc(e.message)+'</span>'}}
async function add(){var b=document.getElementById('add'),s=document.getElementById('status');b.disabled=true;s.textContent='Saving bets…';try{var r=await fetch('/api/chat-import',{method:'POST',headers:{'content-type':'application/json'},credentials:'same-origin',body:JSON.stringify(payload)}),j=await r.json();if(!r.ok)throw Error(j.error||'Import failed');s.innerHTML='<span class="good">Saved '+j.added+' bet'+(j.added===1?'':'s')+'. They are now in your private Netlify bet store.</span>';b.classList.add('hidden');history.replaceState(null,'',location.pathname)}catch(e){s.innerHTML='<span class="bad">'+esc(e.message)+'</span>';b.disabled=false}}
document.getElementById('unlock').onclick=auth;document.getElementById('add').onclick=add;payload=decode();render();if(payload)session().then(function(ok){document.getElementById(ok?'add':'login').classList.remove('hidden')});
</script></body></html>
