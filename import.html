<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0B162A"><title>Add Bets</title><style>
:root{--bg:#0B162A;--panel:#15243B;--border:#30415B;--text:#f7f9fb;--muted:#8fb0c9;--accent:#E64100;--good:#63e6a1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:680px;margin:auto;padding:16px;min-height:100vh}h1{font-size:22px}.sub,.meta{color:var(--muted);font-size:12px}.card,.box{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px;margin:10px 0}.card b{display:block;margin-bottom:5px}.legs{border-top:1px solid var(--border);margin-top:8px;padding-top:7px;font-size:12px}.leg{padding:4px 0}.totals{font-weight:800;margin:14px 0}button,input{font:inherit;border-radius:9px;padding:10px;border:1px solid var(--border)}button{background:var(--accent);color:white;font-weight:800;width:100%}input{background:#0d1720;color:white;width:100%;margin:7px 0}#status{margin:12px 0;font-size:13px}.good{color:var(--good)}.bad{color:#ff8c8c}a{color:#b8d4e8}.hidden{display:none}</style></head><body><div class="app"><h1>Add bets</h1><div class="sub">Review bets before saving them to your private football app.</div><div id="content"></div><div id="login" class="box hidden"><b>Unlock private bets</b><input id="key" type="password" autocomplete="current-password" placeholder="Access key"><button id="unlock">Unlock</button></div><button id="add" class="hidden">Add bets</button><div id="status"></div><a href="/">Back to football app</a></div><script>
var payload=null;function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[c]})}function money(n){return'$'+Number(n||0).toFixed(2).replace('.00','')}
async function decode(){try{var q=new URLSearchParams(location.search),id=q.get('id');if(id){if(!/^[a-z0-9-]+$/i.test(id))throw Error('Invalid import ID');var r=await fetch('/imports/'+id+'.json',{cache:'no-store'});if(!r.ok)throw Error('Import not found');return await r.json()}var p=new URLSearchParams(location.hash.slice(1)).get('bets');if(!p)throw Error('No bet payload in this link.');p=p.replace(/-/g,'+').replace(/_/g,'/');while(p.length%4)p+='=';return JSON.parse(decodeURIComponent(escape(atob(p))))}catch(e){document.getElementById('status').innerHTML='<span class="bad">'+esc(e.message)+'</span>';return null}}
function render(){if(!payload)return;var risk=0,win=0,html='';payload.bets.forEach(function(b){risk+=Number(b.risk||0);win+=Number(b.toWin||0);html+='<div class="card"><b>'+esc(b.description||b.selection||'Bet')+'</b><div class="meta">Bet ID '+esc(b.betId)+' · Risk '+money(b.risk)+' · To win '+money(b.toWin)+'</div>';if(b.legs)html+='<div class="legs">'+b.legs.map(function(l){return'<div class="leg">• '+esc(l.raw||l.selection||'Leg')+'</div>'}).join('')+'</div>';html+='</div>'});html+='<div class="totals">'+payload.bets.length+' bets · '+money(risk)+' risk · '+money(win)+' possible profit</div>';document.getElementById('content').innerHTML=html}
async function session(){try{var r=await fetch('/api/session',{credentials:'same-origin'}),j=await r.json();return!!j.authenticated}catch(e){return false}}async function auth(){var key=document.getElementById('key').value,s=document.getElementById('status');if(!key)return;s.textContent='Unlocking…';try{var r=await fetch('/api/session',{method:'POST',headers:{'content-type':'application/json'},credentials:'same-origin',body:JSON.stringify({key:key})}),j=await r.json();if(!r.ok)throw Error(j.error||'Unlock failed');document.getElementById('key').value='';document.getElementById('login').classList.add('hidden');document.getElementById('add').classList.remove('hidden');s.innerHTML='<span class="good">Unlocked. Review above, then tap Add bets.</span>'}catch(e){s.innerHTML='<span class="bad">'+esc(e.message)+'</span>'}}async function add(){var b=document.getElementById('add'),s=document.getElementById('status');b.disabled=true;s.textContent='Saving bets…';try{var r=await fetch('/api/chat-import',{method:'POST',headers:{'content-type':'application/json'},credentials:'same-origin',body:JSON.stringify(payload)}),j=await r.json();if(!r.ok)throw Error(j.error||'Import failed');s.innerHTML='<span class="good">Saved '+j.added+' bets.</span>';b.classList.add('hidden')}catch(e){s.innerHTML='<span class="bad">'+esc(e.message)+'</span>';b.disabled=false}}
document.getElementById('unlock').onclick=auth;document.getElementById('add').onclick=add;(async function(){payload=await decode();render();if(payload){var ok=await session();document.getElementById(ok?'add':'login').classList.remove('hidden')}})();</script></body></html>
