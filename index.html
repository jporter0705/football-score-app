<!doctype html>
<html>
<head>

<style>
#betLogin{font-size:12px;margin:8px 0;display:flex;align-items:center;gap:6px;flex-wrap:wrap}#betLogin[hidden],#betLogout[hidden]{display:none}#betLogin input{width:140px;background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px}#betLogin button,#betLogout{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px;cursor:pointer}#betLogout{font-size:11px;margin:6px 0}
:root{--bg:#0B162A;--panel:#15243B;--border:#30415B;--text:#f7f9fb;--muted:#8fb0c9;--accent:#E64100;--good:#63e6a1;--bad:#ef5350}
*{box-sizing:border-box}
body{margin:0;background:#0B162A;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:760px;margin:auto;min-height:100vh;background:var(--bg);padding:8px}
header{position:sticky;top:0;background:var(--bg);z-index:10;padding-top:4px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.tab{border:0;background:transparent;color:#9eb7ca;padding:12px 4px;font-weight:800}
.tab.active{background:#1a2a3a;color:#fff}
.toolbar{display:flex;gap:6px;align-items:center;margin:7px 0}
.toolbar select,.toolbar button{background:var(--panel);border:1px solid var(--border);color:#fff;border-radius:8px;padding:6px}
.updated{margin-left:auto;color:var(--muted);font-size:10px}
.view{display:none}.view.active{display:block}
.game,.card{background:var(--panel);border:1px solid #79402F;border-radius:12px;padding:10px;margin:8px 0}
.game.live,.card.live{border-color:#C45129;border-left:4px solid var(--accent)}
.gh,.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.state,.sub{font-size:10px;color:var(--muted)}
.teamrow{display:grid;grid-template-columns:24px 1fr auto;gap:7px;align-items:center;padding:2px 0}
.logo{width:22px;height:22px;object-fit:contain}
.team{font-weight:800}.poss{font-size:12px;margin-left:5px;vertical-align:1px}.score{font-size:18px;font-weight:900}
.star,.dollarBtn{border:0;background:none;padding:0}
.star{color:#718092;font-size:21px}.star.on{color:var(--accent)}
.dollarBtn{color:var(--good);font-weight:900;font-size:17px;margin-right:8px}
.pick{font-weight:900;margin-top:7px}
.money,.scorelink{font-size:12px;margin-top:5px}
.scorelink{display:inline-block;text-decoration:underline;color:#b8d4e8;cursor:pointer}
.situation{border-top:1px solid var(--border);margin-top:7px;padding-top:6px;font-size:12px;font-weight:800}
.lastplay{font-size:10px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-block;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:900}
.win{background:var(--good);color:#07140c}.loss{background:#c94d4d}.push{background:#5d6a75}.upcoming{background:#d6dde4;color:#26303a}.livepill{border:1px solid var(--accent);color:#FFD1BE;background:#40291F}
.weekline{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin:9px 2px}
.summary{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.sum{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:7px}
.sum.plpos b{color:var(--good)}.sum.plneg b{color:var(--bad)}
.empty,.error{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px;margin:8px 0;color:var(--muted)}
.manual{display:none;gap:5px;margin-top:7px}.manual.open{display:flex}
.manual button{flex:1;background:#0d1720;border:1px solid var(--border);color:#fff;border-radius:8px;padding:7px}
.filters{display:flex;gap:4px;flex-wrap:wrap;margin:7px 0}
.filter{border:1px solid var(--border);background:#111b25;color:#9eb7ca;border-radius:999px;padding:5px 8px;font-size:9px}
.filter.active{background:#24384b;color:#fff}
.expand{display:block;border:1px solid var(--border);background:#0d1720;color:#c8d8e5;border-radius:8px;padding:6px 8px;font-size:10px;margin-top:8px}
.legs{display:none;margin-top:8px;border-top:1px solid var(--border);padding-top:5px}.legs.open{display:block}
.leg{display:grid;grid-template-columns:1fr auto;gap:8px;padding:7px 0;border-bottom:1px solid #1d2b36}
.leg:last-child{border-bottom:0}.legmain{font-size:12px;font-weight:750}.legsub{font-size:9px;color:var(--muted);margin-top:2px}.legstatus{font-size:10px;font-weight:900;align-self:center}
.legstatus.won{color:var(--good)}.legstatus.lost{color:var(--bad)}.legstatus.pending{color:var(--muted)}
.health{display:inline-flex;gap:3px;vertical-align:middle;margin-left:6px}.hsq{width:9px;height:9px;border-radius:2px;background:#32404d;opacity:.72}.health.h1 .hsq:nth-child(-n+1){background:#ef5350;opacity:1}.health.h2 .hsq:nth-child(-n+2){background:#8f2028;opacity:1}.health.h3 .hsq:nth-child(-n+3){background:#f2c94c;opacity:1}.health.h4 .hsq:nth-child(-n+4){background:#168a52;opacity:1}.health.h5 .hsq:nth-child(-n+5){background:#63e6a1;opacity:1}.healthrow{display:flex;align-items:center;gap:5px;margin-top:6px;font-size:10px;color:var(--muted)}
footer{text-align:center;color:var(--muted);font-size:9px;padding:16px}

.rank{font-size:11px;font-weight:600;color:var(--muted);margin-right:5px}
.bet-filters{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:9px 0;overflow-x:auto;scrollbar-width:thin}
.bet-filters .filters{flex-wrap:nowrap;margin:0;flex-shrink:0}
.sport-filters{margin-left:auto!important;border-left:1px solid #466077;padding-left:9px}
.filter{cursor:pointer;min-height:30px;white-space:nowrap}
.status-pack{display:flex;align-items:center;justify-content:flex-end;gap:5px;flex-shrink:0}
.status-button{border:0;padding:0;background:none;color:inherit;cursor:pointer}
.status-pack .health{margin:0;gap:3px}.status-pack .hsq{width:24px;height:24px;flex:0 0 24px;border-radius:2px}.status-pack .pill{min-height:24px;line-height:14px;padding:5px 8px}.status-pack .livepill{padding:4px 8px}
.top>div:first-child{min-width:0}.top b{font-size:13px;line-height:1.4;display:block}
.game-actions{display:flex;gap:10px;align-items:center}
.gamecast{display:inline-block;color:#aacde6;font-size:11px;text-decoration:none;padding:7px 0}
.gamecast:hover{text-decoration:underline}.card-links{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.game-clock-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:4px;min-height:27px}
.game-clock-row .gamecast{margin-left:auto;white-space:nowrap;padding:4px 0}.game-clock-row .scorelink{margin-top:0}
.game-leagues{display:flex;align-items:center;gap:6px;margin:7px 0}
.conference-picker{position:relative;margin-left:2px}.conference-picker select{appearance:none;background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:999px;font:inherit;font-size:10px;min-height:30px;padding:5px 26px 5px 10px;cursor:pointer}
.conference-picker[hidden]{display:none}.conference-picker:not([hidden]):after{content:'▾';position:absolute;right:10px;top:7px;color:var(--muted);pointer-events:none;font-size:12px}
#refreshBtn{font-size:23px;width:38px;height:34px;padding:0;cursor:pointer}#refreshBtn:disabled{opacity:.5;cursor:wait}
.updated{font-size:11px}.leg .status-pack{align-self:start}.leg .gamecast{font-size:10px}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
@media(max-width:360px){.filter{padding:5px 6px;font-size:9px}.bet-filters{gap:4px}.sport-filters{padding-left:5px}.top{gap:5px}.top b{font-size:12px}}

.tab.active{background:#20314A;box-shadow:inset 0 -3px var(--accent)}
.filter.active{background:#273951;border-color:var(--accent)}
#weekSelect{border-color:var(--accent);font-weight:700;min-height:36px}
.toolbar{flex-wrap:wrap;gap:9px}.updated{flex:1;min-width:150px;font-size:10px;line-height:1.6;text-align:right}
.review{border:1px solid var(--accent);color:#FFD1BE;max-width:180px;white-space:normal}
.status-pack{max-width:48%}.status-button:disabled{cursor:default}
#storageStatus{font-size:11px;color:#FFD1BE}.manual.open{flex-wrap:wrap}
select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

.preview-tools{display:flex;gap:8px;align-items:center;margin:8px 0;flex-wrap:wrap;font-size:11px}
.preview-tools[hidden]{display:none}
.preview-tools button{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px;cursor:pointer}
.preview-tools button[aria-pressed="true"]{border-color:var(--accent)}
.sample-note{padding:10px 12px;margin:8px 0;border-left:3px solid var(--accent);background:#20314A;color:#CCD9EB;font-size:12px;line-height:1.6;border-radius:6px}
.record-win{color:var(--good)}.record-loss{color:#FF8585;font-weight:800}.record-push,.record-separator{color:#A6AFBA}
.bet-matchup{display:flex;flex-wrap:wrap;align-items:center;gap:5px 8px}.bet-team{display:flex;align-items:center;gap:6px;min-width:0}.bet-team .logo{width:22px;height:22px;flex:0 0 22px}.bet-team .rank{margin:0;color:#FFD1BE}.matchup-at{font-size:10px;font-weight:500;color:var(--muted);margin-left:0}.bet-team-name{overflow-wrap:anywhere}.card .top{flex-wrap:wrap}.card .top>div:first-child{flex:1 1 220px}.card .top>.status-pack{max-width:100%;margin-left:auto}.leg .status-pack{max-width:none}.leg-matchup{margin:5px 0}.leg-matchup .bet-team{font-size:11px}.leg-matchup .logo{width:18px;height:18px;flex-basis:18px}
.status-pack{flex-direction:column;align-items:flex-end}.status-pack .health{order:2;gap:2px}.status-pack .hsq{width:19px;height:19px;flex-basis:19px}
.card .top{flex-wrap:nowrap}.card .top>div:first-child{flex:1 1 0}.card .situation,.card .pick{font-size:16px}
#betLogout{margin:0;white-space:nowrap}.toolbar{gap:6px}.updated{min-width:0}
@media(max-width:520px){.toolbar{flex-wrap:nowrap}#weekSelect{max-width:45%;font-size:11px}.updated{font-size:9px}#refreshBtn{flex-shrink:0;width:30px}.leg{grid-template-columns:minmax(0,1fr) auto}}
</style>
</head>
<body>
<div class="app">
<header>
<div class="tabs">
<button class="tab active" data-tab="scoreboard">Scoreboard</button>
<button class="tab" data-tab="bets">Bets</button>
<button class="tab" data-tab="allgames">All Games</button>
</div>
<div class="toolbar" id="toolbar">
<select id="weekSelect" aria-label="Betting week"></select><span id="betDates" style="margin-right:auto;font-size:11px;color:var(--muted)" hidden></span>
<button id="betLogout" hidden type="button">Lock bets</button>
<span class="updated" id="updated" role="status" aria-live="polite">Loading…</span>
<button id="refreshBtn" type="button" aria-label="Refresh scores and bets" title="Refresh scores and bets">↻</button>
</div>
</header>
<form id="betLogin" hidden><label>Private bets <input id="betPassword" type="password" autocomplete="current-password" placeholder="Access key" required></label> <button type="submit">Unlock</button><span id="loginStatus" role="status"></span></form>
<div id="storageStatus" role="status"></div><div class="preview-tools"><button id="sampleRankings" type="button" aria-pressed="false">Sample rankings: Off</button></div>
<main>
<section id="scoreboard" class="view active"></section>
<section id="bets" class="view"></section>
<section id="allgames" class="view"></section>
</main>
<footer>Refreshes only while app is visible • ESPN + BetOnline data • build v4.7.1</footer>
</div>
<script>
var S={collegeAll:[],collegeView:[],nfl:[],bets:[],week:null,lastUpdate:0,summaries:{}};
var tab=localStorage.getItem('football-v4-tab')||'scoreboard';
var sport=localStorage.getItem('football-v4-sport')||'college';
var group=localStorage.getItem('football-v45-conference')||'80';
var betFilter='all',betSport='all',refreshing=false;

function norm(s){
  return String(s||'').toLowerCase()
    .replace(/&/g,' and ').replace(/[^a-z0-9 ]/g,' ')
    .replace(/\s+/g,' ')
    .replace(/\bcal\b/g,'california')
    .replace(/\busf\b/g,'south florida')
    .replace(/\bsam houston state\b/g,'sam houston')
    .replace(/\bsam houston st\b/g,'sam houston')
    .replace(/\boklahoma st\b/g,'oklahoma state')
    .replace(/\boregon st\b/g,'oregon state')
    .replace(/\bmississippi st\b/g,'mississippi state')
    .replace(/\bjacksonville st\b/g,'jacksonville state').trim();
}
function esc(value){return String(value==null?'':value).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function gamecastLink(sp,id){if(!/^\d+$/.test(String(id||'')))return '';return '<a class="gamecast" href="https://www.espn.com/'+(String(sp).toLowerCase()==='nfl'?'nfl':'college-football')+'/game/_/gameId/'+id+'" target="_blank" rel="noopener noreferrer">ESPN Gamecast ↗</a>'}
function weekDates(){if(S.week&&S.week.start&&S.week.end)return S.week.start.replace(/-/g,'')+'-'+S.week.end.replace(/-/g,'');var d=new Date(),offset=(d.getDay()+5)%7;d.setDate(d.getDate()-offset);var start=dateKey(d);d.setDate(d.getDate()+6);return start+'-'+dateKey(d)}
function dateKey(d){return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')}
function collegeRank(c){var n=Number(c&&c.curatedRank&&c.curatedRank.current);return Number.isInteger(n)&&n>=1&&n<=25?n:null}
function ymd(){var d=new Date();return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')}
function getFavs(){try{return new Set(JSON.parse(localStorage.getItem('football-v4-favs')||'[]'))}catch(e){return new Set()}}
var favs=getFavs();
function saveFavs(){localStorage.setItem('football-v4-favs',JSON.stringify(Array.from(favs)))}
function ov(){try{return JSON.parse(localStorage.getItem('football-v4-overrides')||'{}')}catch(e){return {}}}
function setOv(id,v){var o=ov();if(v==='auto')delete o[id];else o[id]=v;localStorage.setItem('football-v4-overrides',JSON.stringify(o));renderBets()}
function comp(e){return e&&e.competitions&&e.competitions[0]?e.competitions[0]:{}}
function gs(e){var c=comp(e);return c.status&&c.status.type?c.status.type.state:'pre'}
function teams(e){var a=null,h=null,cs=comp(e).competitors||[];cs.forEach(function(x){if(x.homeAway==='away')a=x;if(x.homeAway==='home')h=x});return{away:a,home:h}}
function teamVals(c){if(!c||!c.team)return[];var t=c.team;return[t.location,t.shortDisplayName,t.displayName,t.name,t.abbreviation].filter(Boolean).map(norm)}
function teamMatches(c,w){var n=norm(w);if(!n)return false;return teamVals(c).some(function(v){return v===n||v.indexOf(n+' ')===0||n.indexOf(v+' ')===0})}
function gameMatches(e,b){var t=teams(e);return teamMatches(t.away,b.awayTeam)&&teamMatches(t.home,b.homeTeam)}
function eventPoolForSport(sp){return sp==='NFL'?S.nfl:S.collegeAll}
function findGame(b){
  var pool=eventPoolForSport(b.sport);
  if(b.espnEventId){
    var byId=pool.find(function(e){return String(e.id)===String(b.espnEventId)});
    if(byId)return byId;
  }
  return pool.find(function(e){return gameMatches(e,b)})||null;
}
function betsFor(e,sp){
  return S.bets.filter(function(b){
    if((sp==='nfl')!==(b.sport==='NFL'))return false;
    if(b.espnEventId)return String(b.espnEventId)===String(e.id);
    if(Array.isArray(b.legs)&&b.legs.some(function(l){return l.espnEventId&&String(l.espnEventId)===String(e.id)}))return true;
    return gameMatches(e,b);
  });
}
function top25Event(e){
  return (comp(e).competitors||[]).some(function(c){
    var r=collegeRank(c);
    return r&&r<=25;
  });
}
function gameDetail(e){
  var c=comp(e),st=c.status||e.status||{},state=st.type?st.type.state:'pre',d=st.type?(st.type.shortDetail||st.type.detail||''):'';
  return state==='in'?'LIVE · '+d:state==='post'?(d||'Final'):d;
}
function gameClock(e){var st=comp(e).status||e.status||{},detail=gameDetail(e);if(gs(e)!=='in'||/half|end|delay|suspend/i.test(detail))return detail;var clock=st.displayClock,p=Number(st.period);return clock?'LIVE · '+clock+(p?' · '+(p>4?'OT':'Q'+p):''):detail||'Live · clock unavailable'}
function sortGames(a,b){var order={in:0,pre:1,post:2},diff=order[gs(a)]-order[gs(b)];return diff||((Date.parse(a.date)||0)-(Date.parse(b.date)||0))}
function shortScore(g){if(!g||gs(g)==='pre')return '';var t=teams(g);return [t.away,t.home].map(function(c){return c?(c.team.abbreviation||c.team.shortDisplayName||'')+' '+c.score:''}).join(' · ')}
function goToBetsForGame(id){
  tab='bets';betFilter='all';betSport='all';renderTabs();
  setTimeout(function(){
    var el=document.querySelector('[data-gameid="'+id+'"]');
    if(el)el.scrollIntoView({behavior:'smooth',block:'center'});
  },50);
}
function goToGame(id){
  sport=S.nfl.some(function(e){return String(e.id)===String(id)})?'nfl':'college';group='80';S.collegeView=S.collegeAll;tab='scoreboard';renderTabs();
  setTimeout(function(){
    var el=document.querySelector('[data-scoregame="'+id+'"]');
    if(el)el.scrollIntoView({behavior:'smooth',block:'center'});
  },50);
}
function possessionCompetitorId(e){var sit=comp(e).situation||{};return sit.possession||sit.possessionId||''}
function gameCard(e,sp){
  var t=teams(e),state=gs(e),key=sp+':'+e.id,linked=betsFor(e,sp).length>0,sit=comp(e).situation||{},poss=String(possessionCompetitorId(e));
  function row(x){
    var rank=sp==='college'?collegeRank(x):null;var tm=x&&x.team?x.team:{},hasPoss=state==='in'&&poss&&String(x&&x.id)===poss;
    return '<div class="teamrow"><img class="logo" alt="" src="'+esc(tm.logo||'')+'"><div class="team">'+(rank?'<span class="rank">'+rank+'</span>':'')+esc(tm.shortDisplayName||tm.displayName||tm.abbreviation||'Team')+(hasPoss?'<span class="poss">🏈</span>':'')+'</div><div class="score">'+(state==='pre'?'':(x&&x.score!=null?x.score:''))+'</div></div>';
  }
  var extra='';
  if(state==='in'){
    var dd=sit.shortDownDistanceText||sit.downDistanceText||'',pt=sit.possessionText||'';
    if(dd||pt)extra+='<div class="situation">'+dd+(pt&&dd.indexOf(pt)<0?' • '+pt:'')+'</div>';
  }
  var clockRow='<div class="game-clock-row"><span class="state">'+esc(gameClock(e))+'</span>'+gamecastLink(sp,e.id)+'</div>';
  var lastPlay=state==='in'&&sit.lastPlay&&sit.lastPlay.text?'<div class="lastplay">Last: '+esc(sit.lastPlay.text)+'</div>':'';
  return '<div class="game '+(state==='in'?'live':'')+'" data-scoregame="'+e.id+'"><div class="gh"><span class="state">'+(state==='in'?'Live':state==='post'?'Final':'Upcoming')+'</span><span>'+(linked?'<button class="dollarBtn" onclick="goToBetsForGame(\''+e.id+'\')">$</button>':'')+'<button class="star '+(favs.has(key)?'on':'')+'" data-key="'+key+'">'+(favs.has(key)?'★':'☆')+'</button></span></div>'+row(t.away)+row(t.home)+extra+clockRow+lastPlay+'</div>';
}
function attachStars(){
  document.querySelectorAll('.star').forEach(function(b){b.onclick=function(){if(favs.has(b.dataset.key))favs.delete(b.dataset.key);else favs.add(b.dataset.key);saveFavs();renderAll()}});
}
function authoritativeResult(b){
  var bo=String(b.betOnlineStatus||'').toUpperCase();
  if(bo==='WON')return'won';
  if(bo==='LOST')return'lost';
  if(bo==='PUSH'||bo==='VOID'||bo==='CANCELLED')return'push';
  var o=ov()[b.betId];if(o)return o;
  return null;
}
function result(b,g){
  var auth=authoritativeResult(b);if(auth)return auth;
  if(!g||gs(g)!=='post')return null;
  var t=teams(g),as=Number(t.away&&t.away.score),hs=Number(t.home&&t.home.score);
  if(!isFinite(as)||!isFinite(hs))return null;
  if(b.market==='spread'){
    var pa=teamMatches(t.away,b.selection),v=(pa?as:hs)+Number(b.line||0)-(pa?hs:as);
    return v>0?'won':v<0?'lost':'push';
  }
  if(b.market==='total'){
    var v2=as+hs-Number(b.line),under=String(b.selection||'').toLowerCase().indexOf('under')>=0;
    return under?(v2<0?'won':v2>0?'lost':'push'):(v2>0?'won':v2<0?'lost':'push');
  }
  return null;
}
function legGame(leg,parent){
  var sp=leg.sport||parent.sport||'College',pool=eventPoolForSport(sp);
  if(leg.espnEventId)return pool.find(function(e){return String(e.id)===String(leg.espnEventId)})||null;
  return null;
}
function statusObj(g){return g&&comp(g).status?comp(g).status:{}}
function period(g){return Number(statusObj(g).period||0)}
function clockSeconds(g){
  var d=String(statusObj(g).displayClock||'');if(!d)return null;var p=d.split(':').map(Number);if(p.length!==2||!isFinite(p[0])||!isFinite(p[1]))return null;return p[0]*60+p[1];
}
function gameProgress(g){
  if(!g)return 0;if(gs(g)==='post')return 1;if(gs(g)==='pre')return 0;
  var p=Math.max(1,period(g)),sec=clockSeconds(g),per=p<=4?900:600;if(sec==null)sec=per/2;

function summaryFor(id){return id?S.summaries[String(id)]||null:null}
function findAthleteStat(summary,player,statType){
  if(!summary||!player)return null;var target=norm(player),out=null;
  (summary.boxscore&&summary.boxscore.players||[]).forEach(function(team){
    (team.statistics||[]).forEach(function(group){
      var idx=-1,keys={rushing_yards:['rushingyards','rushing yards','rush yds'],receiving_yards:['receivingyards','receiving yards','rec yds'],passing_yards:['passingyards','passing yards','pass yds'],receptions:['receptions','rec'],passing_interceptions:['interceptions'],passing_tds_gte:['passingtouchdowns','passing touchdowns','passing tds','td']};
      [group.keys,group.names,group.descriptions,group.labels].some(function(columns){
        var names=(columns||[]).map(function(x){return String(x).toLowerCase()});
        return (keys[statType]||[]).some(function(k){idx=names.indexOf(k);return idx>=0});
      });

      (group.athletes||[]).forEach(function(a){var nm=norm(a.athlete&&(a.athlete.displayName||a.athlete.shortName||a.athlete.fullName));if(nm===target||nm.indexOf(target)>=0||target.indexOf(nm)>=0){var v=a.stats&&a.stats[idx];if(v!=null&&v!=='')out=Number(String(v).split('/')[0])}});

function anytimeTdHit(summary,player){

function isReversibleStat(type){return type==='rushing_yards'||type==='receiving_yards'||type==='passing_yards'||type==='return_yards'}

    return{status:state==='in'?'live':'pending',locked:false,value:v,target:line};
  }

    if(v>line)return{status:'lost',locked:true,value:v,target:line};
    if(state==='post')return{status:'won',locked:true,value:v,target:line};
  }else{
    if(v>line&&!isReversibleStat(type))return{status:'won',locked:true,value:v,target:line};

function halfFinished(g){return g&&(gs(g)==='post'||period(g)>=3||(period(g)===2&&clockSeconds(g)===0))}

function evaluateMarket(item,g){

  var scope=String(item.scope||item.period||item.segment||'game').toLowerCase(),isH1=scope.indexOf('h1')>=0||scope.indexOf('first')>=0;
  if(item.market==='player_prop')return propEval(item,g);

    if(st==='post'){var selAway=teamMatches(sn.t.away,item.selection),d=(selAway?sn.a:sn.h)-(selAway?sn.h:sn.a);return{status:d>0?'won':d<0?'lost':'push',locked:true}}

  }

  if(!isH1&&st!=='post')return{status:st==='in'?'live':'pending'};

    var pa=teamMatches(sn.t.away,item.selection),v=(pa?sn.a:sn.h)+Number(item.line||0)-(pa?sn.h:sn.a);return{status:v>0?'won':v<0?'lost':'push',locked:true}
  }

    var diff=sn.a+sn.h-Number(item.line),under=String(item.selection||'').toLowerCase().indexOf('under')>=0;return{status:under?(diff<0?'won':diff>0?'lost':'push'):(diff>0?'won':diff<0?'lost':'push'),locked:true}
  }

}
function legDisplayStatus(leg,parent){
  var s=String(leg.status||'').toUpperCase();if(s==='WON')return'won';if(s==='LOST')return'lost';if(s==='PUSH'||s==='VOID'||s==='CANCELLED')return'push';
  return evaluateMarket(leg,legGame(leg,parent)).status||'pending';
}
function parlayAutoResult(b){
  if(!Array.isArray(b.legs)||!b.legs.length)return null;var ss=b.legs.map(function(l){return legDisplayStatus(l,b)});if(ss.indexOf('lost')>=0)return'lost';if(b.structure==='teaser'&&ss.indexOf('push')>=0)return null;if(ss.every(function(x){return x==='push'}))return'push';if(ss.every(function(x){return x==='won'||x==='push'}))return'won';return null;
}
function betState(b,g){
  var r=authoritativeResult(b)||parlayAutoResult(b)||result(b,g);if(r)return'closed';
  if(Array.isArray(b.legs)&&b.legs.some(function(l){var lg=legGame(l,b);return lg&&gs(lg)==='in'}))return'live';
  if(g&&gs(g)==='in')return'live';return'upcoming';

function healthHtml(n){if(!n)return'';return'<span class="health h'+n+'" role="img" aria-label="Bet health '+n+' out of 5" title="Bet health '+n+' out of 5"><i class="hsq"></i><i class="hsq"></i><i class="hsq"></i><i class="hsq"></i><i class="hsq"></i></span>'}
function gameHealth(item,g){
  if(!g||gs(g)!=='in')return null;var sn=scoreNums(g),prog=gameProgress(g),remain=1-prog;if(!isFinite(sn.a)||!isFinite(sn.h))return 3;
  if(item.market==='spread'){
    var pa=teamMatches(sn.t.away,item.selection),edge=(pa?sn.a:sn.h)+Number(item.line||0)-(pa?sn.h:sn.a),scale=4+14*remain,x=edge/scale;return x>.65?5:x>.15?4:x>-.15?3:x>-.65?2:1;
  }
  if(item.market==='total'){
    var total=sn.a+sn.h,line=Number(item.line),under=String(item.selection||'').toLowerCase().indexOf('under')>=0,pace=prog>.08?total/prog:total*2,edge=under?line-pace:pace-line,scale=Math.max(7,line*.18),x=edge/scale;return x>.6?5:x>.12?4:x>-.12?3:x>-.6?2:1;
  }
  if(item.market==='moneyline'){
    var pa2=teamMatches(sn.t.away,item.selection),m=(pa2?sn.a:sn.h)-(pa2?sn.h:sn.a),scale=3+14*remain,x2=m/scale;return x2>.7?5:x2>.15?4:x2>-.15?3:x2>-.7?2:1;
  }

}
function propHealth(item,g){
  if(!g||gs(g)!=='in')return null;var e=propEval(item,g);if(e.status==='won')return 5;if(e.status==='lost')return 1;var p=gameProgress(g);
  if((item.propType||'')==='anytime_td')return p<.35?3:p<.7?2:1;
  if(e.value==null||!isFinite(e.target)||!e.target)return 3;var ratio=e.value/e.target,expected=Math.max(.12,p),pace=ratio/expected;
  if(ratio>=1)return 5;if(pace>=1.35)return 5;if(pace>=1.05)return 4;if(pace>=.72)return 3;if(pace>=.45)return 2;return 1;
}
function itemHealth(item,g){return item.market==='player_prop'?propHealth(item,g):gameHealth(item,g)}

function toggleM(id){var x=document.getElementById(id);if(x)x.classList.toggle('open')}

function summaryUrl(sp,id){return '/api/summary?sport='+(sp==='NFL'?'nfl':'college')+'&event='+encodeURIComponent(id)}
async function fetchSummary(sp,id){

}
async function refreshSummaries(){

  function want(sp,id){if(id)wants[String(id)]={sp:sp,id:String(id)}}
  S.bets.forEach(function(b){
    if(b.market==='player_prop'){var g=findGame(b);if(g&&gs(g)!=='pre')want(b.sport,b.espnEventId)}

  });

}

<script src="weeks.js"></script>
<script>
// Presentation-only samples: never add these events to S or to saved history.
var sampleRankings=new URLSearchParams(location.search).get('samples')==='1';
function sampleCollegeGames(){
  function team(id,name,abbreviation,rank,conference,score,side){return {id:id,homeAway:side,score:String(score),curatedRank:{current:rank||99},team:{displayName:name,shortDisplayName:name,abbreviation:abbreviation,conferenceId:conference,logo:'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"><rect width="24" height="24" rx="6" fill="#30415B"/><text x="12" y="16" text-anchor="middle" font-family="sans-serif" font-size="9" fill="white">'+abbreviation+'</text></svg>')}}}
  function game(id,away,home,state){return {id:'sample-'+id,date:selectedWeek.start+'T19:00:00',competitions:[{competitors:[away,home],status:{type:{state:state,completed:state==='post',shortDetail:state==='post'?'Final · sample':state==='in'?'Q3 · sample':'Saturday · sample'},period:3,displayClock:'8:42'}}]}}
  return [game('1',team('a','Ohio State','OSU',3,'5',21,'away'),team('b','Oregon','ORE',12,'5',17,'home'),'in'),game('2',team('c','North Carolina','UNC',null,'1',14,'away'),team('d','Clemson','CLEM',17,'1',28,'home'),'post'),game('3',team('e','Michigan','MICH',24,'5',0,'away'),team('f','Penn State','PSU',6,'5',0,'home'),'pre')];
}
function renderSampleBoard(id){
  var games=sampleCollegeGames().filter(function(e){return group==='80'||group==='top25'||comp(e).competitors.some(function(c){return c.team.conferenceId===group})});
  document.getElementById(id).innerHTML=leagueControls()+'<div class="sample-note"><b>Sample rankings and scores</b><br>Illustrative only—not ESPN results. Your real bets and grades are unchanged.</div><div class="weekline"><b>'+(id==='scoreboard'?'Sample tracked games':'Sample college games')+'</b><span>'+esc(selectedWeek.label)+'</span></div>'+games.map(function(e){return gameCard(e,'college').replace(/<button class="star[^>]*>[\s\S]*?<\/button>/g,'')}).join('')+(games.length?'':'<div class="empty">Choose All, ACC, or Big Ten to view these samples.</div>');
  bindLeagueControls();
}
var realScoreboardRenderer=renderScoreboard,realAllGamesRenderer=renderAllGames;
renderScoreboard=function(){if(sampleRankings&&sport==='college')renderSampleBoard('scoreboard');else realScoreboardRenderer()};
renderAllGames=function(){if(sampleRankings&&sport==='college')renderSampleBoard('allgames');else realAllGamesRenderer()};
function updateSampleButton(){var b=document.getElementById('sampleRankings');b.setAttribute('aria-pressed',String(sampleRankings));b.textContent=sampleRankings?'Sample rankings: On':'Sample rankings: Off'}
document.getElementById('sampleRankings').onclick=function(){sampleRankings=!sampleRankings;if(sampleRankings){sport='college';group='80';if(tab==='bets')tab='scoreboard'}updateSampleButton();renderTabs()};
if(sampleRankings){sport='college';group='80';tab='scoreboard'}
updateSampleButton();
if(!localPreview&&!sampleRankings)document.getElementById('sampleRankings').parentElement.hidden=true;
</script>
<script>
document.querySelectorAll('.tab').forEach(function(b){b.onclick=function(){tab=b.dataset.tab;renderTabs()}});
document.getElementById('refreshBtn').onclick=function(){refresh('full')};
document.addEventListener('visibilitychange',function(){if(!document.hidden)automaticRefresh()});
if(location.hostname!=='127.0.0.1'&&location.hostname!=='localhost'&&'serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(function(){});
startHistory();setInterval(automaticRefresh,30000);
</script>
