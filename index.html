<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08111a"><title>Football Scoreboard</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{--bg:#08111a;--panel:#111c27;--border:#263746;--text:#f7f9fb;--muted:#8fb0c9;--accent:#f2c94c;--good:#63e6a1;--bad:#ef5350}*{box-sizing:border-box}body{margin:0;background:#02070c;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:760px;margin:auto;min-height:100vh;background:var(--bg);padding:8px}header{position:sticky;top:0;background:rgba(8,17,26,.97);z-index:10;padding-top:4px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--border);border-radius:14px;overflow:hidden}.tab{border:0;background:transparent;color:#9eb7ca;padding:12px 4px;font-weight:800}.tab.active{background:#1a2a3a;color:#fff}.toolbar{display:none;gap:6px;align-items:center;margin:7px 0}.toolbar select,.toolbar button{background:var(--panel);border:1px solid var(--border);color:#fff;border-radius:8px;padding:6px}.updated{margin-left:auto;color:var(--muted);font-size:10px}.view{display:none}.view.active{display:block}.game,.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:10px;margin:8px 0}.game.live,.card.live{border-left:4px solid #567794}.gh,.top{display:flex;justify-content:space-between;gap:8px}.state,.sub{font-size:10px;color:var(--muted)}.teamrow{display:grid;grid-template-columns:24px 1fr auto;gap:7px;align-items:center;padding:2px 0}.logo{width:22px;height:22px;object-fit:contain}.team{font-weight:800}.score{font-size:18px;font-weight:900}.star{border:0;background:none;color:#718092;font-size:21px}.star.on{color:var(--accent)}.dollar{color:var(--good);font-weight:900;font-size:17px;margin-right:6px}.pick{font-weight:900;margin-top:7px}.money,.scorelink{font-size:12px;margin-top:5px}.scorelink{text-decoration:underline;color:#b8d4e8}.pill{display:inline-block;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:900}.win{background:var(--good);color:#07140c}.loss{background:#c94d4d}.upcoming{background:#d6dde4;color:#26303a}.livepill{border:1px solid #3b5368}.weekline{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin:9px 2px}.summary{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.sum{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:7px}.empty,.error{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px;margin:8px 0;color:var(--muted)}.manual{display:none;gap:5px;margin-top:7px}.manual.open{display:flex}.manual button{flex:1;background:#0d1720;border:1px solid var(--border);color:#fff;border-radius:8px;padding:7px}.filters{display:flex;gap:4px;flex-wrap:wrap;margin:7px 0}.filter{border:1px solid var(--border);background:#111b25;color:#9eb7ca;border-radius:999px;padding:5px 8px;font-size:9px}.filter.active{background:#24384b;color:#fff}footer{text-align:center;color:var(--muted);font-size:9px;padding:16px}
</style></head><body><div class="app"><header><div class="tabs"><button class="tab active" data-tab="scoreboard">Scoreboard</button><button class="tab" data-tab="bets">Bets</button><button class="tab" data-tab="allgames">All Games</button></div><div class="toolbar" id="toolbar"><select id="sportSel"><option value="college">College</option><option value="nfl">NFL</option></select><select id="conference"><option value="80">All FBS</option><option value="1">ACC</option><option value="4">Big 12</option><option value="5">Big Ten</option><option value="8">SEC</option></select><span class="updated" id="updated">Loading…</span><button id="refreshBtn">↻</button></div></header><main><section id="scoreboard" class="view active"></section><section id="bets" class="view"></section><section id="allgames" class="view"></section></main><footer>ESPN scores refresh every 30 seconds • bet feed from GitHub • build v4.1</footer></div><script>
var ESPN={college:'https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard',nfl:'https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard'};
var BET_URL='https://raw.githubusercontent.com/jporter0705/football-score-data/main/current-week.json';
var S={collegeAll:[],collegeView:[],nfl:[],bets:[],week:null,lastUpdate:0};
var tab=localStorage.getItem('football-v4-tab')||'scoreboard', sport=localStorage.getItem('football-v4-sport')||'college', group=localStorage.getItem('football-v4-group')||'80', betFilter='all';
function norm(s){return String(s||'').toLowerCase().replace(/[^a-z0-9& ]/g,' ').replace(/\s+/g,' ').replace(/\b(california golden bears)\b/g,'california').replace(/\busf\b/g,'south florida').replace(/\bsam houston st\b/g,'sam houston').replace(/\boklahoma st\b/g,'oklahoma state').replace(/\boregon st\b/g,'oregon state').replace(/\bmississippi st\b/g,'mississippi state').replace(/\bjacksonville st\b/g,'jacksonville state').trim()}
function ymd(){var d=new Date();return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')}
function getFavs(){try{return new Set(JSON.parse(localStorage.getItem('football-v4-favs')||'[]'))}catch(e){return new Set()}}var favs=getFavs();function saveFavs(){localStorage.setItem('football-v4-favs',JSON.stringify(Array.from(favs)))}
function ov(){try{return JSON.parse(localStorage.getItem('football-v4-overrides')||'{}')}catch(e){return {}}}function setOv(id,v){var o=ov();if(v==='auto')delete o[id];else o[id]=v;localStorage.setItem('football-v4-overrides',JSON.stringify(o));renderBets()}
function comp(e){return e&&e.competitions&&e.competitions[0]?e.competitions[0]:{}} function gs(e){var c=comp(e);return c.status&&c.status.type?c.status.type.state:'pre'}
function teams(e){var a=null,h=null,cs=comp(e).competitors||[];cs.forEach(function(x){if(x.homeAway==='away')a=x;if(x.homeAway==='home')h=x});return{away:a,home:h,awayName:a&&a.team?(a.team.displayName||a.team.shortDisplayName||''):'',homeName:h&&h.team?(h.team.displayName||h.team.shortDisplayName||''):''}}
function findGame(b){var pool=b.sport==='NFL'?S.nfl:S.collegeAll;if(b.espnEventId){for(var i=0;i<pool.length;i++)if(String(pool[i].id)===String(b.espnEventId))return pool[i]}var a=norm(b.awayTeam),h=norm(b.homeTeam);for(var j=0;j<pool.length;j++){var t=teams(pool[j]);if(norm(t.awayName)===a&&norm(t.homeName)===h)return pool[j]}return null}
function betsFor(e,sp){var t=teams(e),a=norm(t.awayName),h=norm(t.homeName);return S.bets.filter(function(b){return (sp==='nfl'?b.sport==='NFL':b.sport!=='NFL')&&((b.espnEventId&&String(b.espnEventId)===String(e.id))||(norm(b.awayTeam)===a&&norm(b.homeTeam)===h))})}
function gameDetail(e){var c=comp(e),st=c.status||e.status||{},state=st.type?st.type.state:'pre',d=st.type?(st.type.shortDetail||st.type.detail||''):'';return state==='in'?'LIVE · '+d:state==='post'?(d||'Final'):d}
function gameCard(e,sp){var t=teams(e),state=gs(e),key=sp+':'+e.id,linked=betsFor(e,sp).length>0;function row(x){var tm=x&&x.team?x.team:{};return '<div class="teamrow"><img class="logo" src="'+(tm.logo||'')+'"><div class="team">'+(tm.abbreviation||tm.shortDisplayName||tm.displayName||'Team')+'</div><div class="score">'+(state==='pre'?'':(x&&x.score!=null?x.score:''))+'</div></div>'}return '<div class="game '+(state==='in'?'live':'')+'"><div class="gh"><span class="state">'+gameDetail(e)+'</span><span>'+(linked?'<span class="dollar">$</span>':'')+'<button class="star '+(favs.has(key)?'on':'')+'" data-key="'+key+'">'+(favs.has(key)?'★':'☆')+'</button></span></div>'+row(t.away)+row(t.home)+'</div>'}
function attachStars(){document.querySelectorAll('.star').forEach(function(b){b.onclick=function(){if(favs.has(b.dataset.key))favs.delete(b.dataset.key);else favs.add(b.dataset.key);saveFavs();renderAll()}})}
function result(b,g){var o=ov()[b.betId];if(o)return o;var bo=String(b.betOnlineStatus||'').toUpperCase();if(bo==='WON')return'won';if(bo==='LOST')return'lost';if(!g||gs(g)!=='post')return null;var t=teams(g),as=Number(t.away&&t.away.score),hs=Number(t.home&&t.home.score);if(!isFinite(as)||!isFinite(hs))return null;if(b.market==='spread'){var pa=norm(b.selection)===norm(b.awayTeam),v=(pa?as:hs)+Number(b.line||0)-(pa?hs:as);return v>0?'won':v<0?'lost':'push'}if(b.market==='total'){var v2=as+hs-Number(b.line),under=String(b.selection||'').toLowerCase().indexOf('under')>=0;return under?(v2<0?'won':v2>0?'lost':'push'):(v2>0?'won':v2<0?'lost':'push')}return null}
function betState(b,g){var r=result(b,g);return r?'closed':(g&&gs(g)==='in'?'live':'upcoming')}
function fmtPick(b){if(b.market==='spread')return (b.selection||'')+' '+(Number(b.line)>0?'+':'')+(b.line!=null?b.line:'');if(b.market==='total'||b.market==='first_half_total')return (b.selection||'')+' '+(b.line!=null?b.line:'');return b.selection||b.description||String(b.structure||'Wager').replace(/_/g,' ')}
function pill(b,g){var r=result(b,g);if(r==='won')return '<span class="pill win">Won'+(b.toWin!=null?' +$'+Number(b.toWin).toFixed(2):'')+'</span>';if(r==='lost')return '<span class="pill loss">Lost'+(b.risk!=null?' -$'+Number(b.risk).toFixed(2):'')+'</span>';if(g&&gs(g)==='in')return '<span class="pill livepill">LIVE</span>';return '<span class="pill upcoming">Upcoming</span>'}
function betCard(b){var g=findGame(b),title=b.awayTeam&&b.homeTeam?b.awayTeam+' at '+b.homeTeam:(b.structure==='parlay'?'Parlay':'Wager'),id='m'+String(b.betId).replace(/[^a-zA-Z0-9]/g,''),money=b.risk!=null?'$'+Number(b.risk).toFixed(0)+(b.toWin!=null?' → $'+Number(b.toWin).toFixed(2):''):'';return '<div class="card '+(betState(b,g)==='live'?'live':'')+'"><div class="top"><div><b>'+title+'</b><div class="sub">'+(b.sport||'Other')+' · '+String(b.structure||'straight').replace(/_/g,' ')+'</div></div><div onclick="toggleM(\''+id+'\')">'+pill(b,g)+'</div></div><div class="pick">'+fmtPick(b)+'</div>'+(money?'<div class="money">'+money+'</div>':'')+'<div class="scorelink">'+(g?gameDetail(g):'No ESPN match yet')+'</div><div class="manual" id="'+id+'"><button onclick="setOv(\''+b.betId+'\',\'won\')">Won</button><button onclick="setOv(\''+b.betId+'\',\'lost\')">Lost</button><button onclick="setOv(\''+b.betId+'\',\'auto\')">Auto</button></div></div>'}
function toggleM(id){var x=document.getElementById(id);if(x)x.classList.toggle('open')}
function renderScoreboard(){var items=S.collegeAll.map(function(e){return{e:e,sp:'college'}}).concat(S.nfl.map(function(e){return{e:e,sp:'nfl'}})).filter(function(x){return favs.has(x.sp+':'+x.e.id)||betsFor(x.e,x.sp).length});document.getElementById('scoreboard').innerHTML='<div class="weekline"><b>Tracked Games</b><span>$ bet-linked · ★ starred</span></div>'+(items.length?items.map(function(x){return gameCard(x.e,x.sp)}).join(''):'<div class="empty">No tracked games yet.</div>');attachStars()}
function renderBets(){var w=0,l=0,pl=0,risk=0;S.bets.forEach(function(b){var r=result(b,findGame(b));if(r==='won'){w++;pl+=Number(b.toWin||0)}else if(r==='lost'){l++;pl-=Number(b.risk||0)}else risk+=Number(b.risk||0)});var cards=S.bets.filter(function(b){return betFilter==='all'||betState(b,findGame(b))===betFilter});document.getElementById('bets').innerHTML='<div class="weekline"><b>'+(S.week&&S.week.label?S.week.label:'Current week')+'</b><span>'+S.bets.length+' wagers</span></div><div class="summary"><div class="sum"><b>'+S.bets.length+'</b> bets</div><div class="sum"><b>'+w+'–'+l+'</b> closed</div><div class="sum"><b>$'+risk.toFixed(0)+'</b> open risk</div><div class="sum"><b>'+(pl>=0?'+':'')+'$'+pl.toFixed(2)+'</b> P/L</div></div><div class="filters">'+['all','live','upcoming','closed'].map(function(x){return '<button class="filter '+(betFilter===x?'active':'')+'" data-f="'+x+'">'+x.charAt(0).toUpperCase()+x.slice(1)+'</button>'}).join('')+'</div>'+cards.map(betCard).join('');document.querySelectorAll('[data-f]').forEach(function(b){b.onclick=function(){betFilter=b.dataset.f;renderBets()}})}
function renderAllGames(){var list=sport==='nfl'?S.nfl:S.collegeView;document.getElementById('allgames').innerHTML='<div class="weekline"><b>'+(sport==='nfl'?'NFL':'College')+'</b><span>tap ☆ to track</span></div>'+(list.length?list.map(function(e){return gameCard(e,sport)}).join(''):'<div class="empty">No games found.</div>');attachStars()}
function renderAll(){renderScoreboard();renderBets();renderAllGames()}
function renderTabs(){document.querySelectorAll('.tab').forEach(function(b){b.classList.toggle('active',b.dataset.tab===tab)});document.querySelectorAll('.view').forEach(function(v){v.classList.toggle('active',v.id===tab)});document.getElementById('toolbar').style.display=tab==='allgames'?'flex':'none';localStorage.setItem('football-v4-tab',tab);renderAll()}
async function fetchBoard(sp,g){var u=ESPN[sp]+'?dates='+ymd()+'&limit=300';if(sp==='college'&&g)u+='&groups='+g;var r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error(sp+' HTTP '+r.status);var j=await r.json();return j.events||[]}
async function fetchBets(){var r=await fetch(BET_URL+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('bet feed HTTP '+r.status);var j=await r.json();S.bets=j.bets||[];S.week=j.week||null}
async function refresh(){var u=document.getElementById('updated');u.textContent='Refreshing…';try{var p1=fetchBoard('college','80'),p2=group==='80'?p1:fetchBoard('college',group),p3=fetchBoard('nfl'),p4=fetchBets();var out=await Promise.all([p1,p2,p3,p4]);S.collegeAll=out[0];S.collegeView=out[1];S.nfl=out[2];S.lastUpdate=Date.now();u.textContent='Updated now';renderAll()}catch(e){u.textContent='Update delayed';document.getElementById(tab).innerHTML='<div class="error">'+String(e.message||e)+'</div>';console.error(e)}}
document.querySelectorAll('.tab').forEach(function(b){b.onclick=function(){tab=b.dataset.tab;renderTabs()}});document.getElementById('sportSel').value=sport;document.getElementById('conference').value=group;document.getElementById('sportSel').onchange=function(){sport=this.value;localStorage.setItem('football-v4-sport',sport);document.getElementById('conference').style.display=sport==='college'?'':'none';renderAllGames()};document.getElementById('conference').onchange=function(){group=this.value;localStorage.setItem('football-v4-group',group);refresh()};document.getElementById('refreshBtn').onclick=refresh;document.getElementById('conference').style.display=sport==='college'?'':'none';if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(function(){});renderTabs();refresh();setInterval(function(){if(!document.hidden)refresh()},30000);
</script></body></html>
